spring.application.name=spring-boot-testcontainers

spring.datasource.url=jdbc:mysql://localhost:3306/flyway?allowLoadLocalInfile=true
spring.datasource.username=root
spring.datasource.password=admin

#hiberbate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
#spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=25
#logging.level.org.hibernate.SQL_SLOW=info

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/changelog
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
